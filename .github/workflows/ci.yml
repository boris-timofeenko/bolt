name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: scripts/test.sh
      - name: App bundle
        run: scripts/build-app.sh release
      - name: Translations are complete
        run: scripts/check-strings.py
